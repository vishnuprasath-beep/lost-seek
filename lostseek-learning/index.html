<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LostSeek Learning — Phase 2</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 1. Header Section -->
  <header class="header">
    <h1>LostSeek Learning</h1>
    <p>Phase 2 — Client-Side LocalStorage Persistence</p>
  </header>

  <!-- 2. Main Content Area -->
  <main class="container">
    <section class="welcome-section">
      <h2>Welcome to Campus Lost &amp; Found</h2>
      <p>Report an item you lost or found on campus.</p>
      <div class="action-buttons">
        <button id="btn-report-lost" class="btn btn-lost">Report Lost Item</button>
        <button id="btn-report-found" class="btn btn-found">Report Found Item</button>
      </div>
    </section>

    <!-- 3. Dynamic Report Form (Hidden by default) -->
    <section id="form-section" class="form-section hidden">
      <h3 id="form-title">Report an Item</h3>
      <form id="report-form">
        <div class="form-group">
          <label for="item-name">Item Name *</label>
          <input type="text" id="item-name" placeholder="e.g. Blue Water Bottle" required>
        </div>

        <div class="form-group">
          <label for="description">Description *</label>
          <textarea id="description" rows="3" placeholder="e.g. Stainless steel bottle with stickers" required></textarea>
        </div>

        <div class="form-group">
          <label for="category">Category *</label>
          <select id="category" required>
            <option value="">Select Category</option>
            <option value="Electronics">Electronics</option>
            <option value="Bottle">Bottle</option>
            <option value="ID Card">ID Card</option>
            <option value="Keys">Keys</option>
            <option value="Bag">Bag</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="color">Color</label>
          <input type="text" id="color" placeholder="e.g. Blue, Silver">
        </div>

        <div class="form-group">
          <label for="location">Location *</label>
          <input type="text" id="location" placeholder="e.g. Library 2nd Floor" required>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-submit">Submit Report</button>
          <button type="button" id="btn-cancel" class="btn btn-cancel">Cancel</button>
        </div>
      </form>
    </section>

    <!-- 4. Reports List Section -->
    <section class="reports-section">
      <div class="reports-header">
        <h3>My Reports</h3>
      </div>
      <div id="reports-list" class="reports-list">
        <!-- Javascript will render report cards here -->
        <p class="empty-state">No reports yet.</p>
      </div>

      <!-- Clear All Reports Action -->
      <div class="reports-footer">
        <button id="btn-clear-reports" class="btn btn-clear">Clear All Reports</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
